<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="850" height="420" role="img" aria-labelledby="t">
<title id="t">The states of a sandbox. doz create makes it, off. doz start boots it: booting, then running (or failed; doz start tries again). From running: doz pause and doz resume (paused: frozen, memory kept, back in about 1 ms); doz sleep and doz wake (asleep: frozen and saved to disk, memory kept, back in about 0.3 s); doz hibernate and doz wake (hibernated: saved to disk, memory given back, back in about 0.3 s); doz shutdown or doz reset (a fresh disk) back to off (powered off, disks kept, programs ended). doz rm removes it.</title>
<desc>stateDiagram-v2
    direction LR
    [*] --&gt; off: doz create
    off --&gt; booting: doz start
    booting --&gt; running
    booting --&gt; failed
    failed --&gt; booting: doz start
    running --&gt; paused: doz pause
    paused --&gt; running: doz resume
    running --&gt; asleep: doz sleep
    asleep --&gt; running: doz wake
    running --&gt; hibernated: doz hibernate
    hibernated --&gt; running: doz wake
    running --&gt; off: doz shutdown
    running --&gt; off: doz reset (a fresh disk)
    off --&gt; [*]: doz rm

    note right of paused: frozen · memory kept · back in ~1 ms
    note right of asleep: frozen and saved to disk · memory kept · back in ~0.3 s
    note right of hibernated: saved to disk · memory given back · back in ~0.3 s
    note left of off: powered off · disks kept · programs ended</desc>
<!-- Drawn by tools/docs-diagrams/sandbox-states.py from the Mermaid state diagram in docs/manual/05-sandboxes-and-lifecycle.md
     (the <desc> above is that source, verbatim: tools/docs-build.py fails when the manual's diagram changes). -->
